name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'python-tutor-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Flutter project
        run: |
          mkdir -p app
          unzip -q python-tutor-project.zip -d app

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-tutor-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
