name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Extract project
        run: |
          ls -la
          ZIP=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d .
          fi
          find . -name "pubspec.yaml" | head -n 20
      - name: Build APK
        run: |
          PUB=$(find . -name "pubspec.yaml" -not -path "*/.pub-cache/*" | head -n 1)
          echo "Found pubspec at: $PUB"
          DIR=$(dirname "$PUB")
          echo "Project dir: $DIR"
          cd "$DIR"
          flutter clean
          flutter pub get
          flutter build apk --release
          # انقل الـ APK للـ root عشان نرفعه
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
