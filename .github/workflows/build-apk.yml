name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      - name: Fix project structure
        run: |
          ls -la
          if [ -f "python-tutor-project.zip" ]; then
            unzip -o python-tutor-project.zip
          fi
          # شوف اسم الفولدر الداخلي ايه
          for d in python-tutor-project python-tutor app; do
            if [ -d "$d/android" ]; then
              echo "Found project in $d"
              cp -a $d/..
              rm -rf $d
              break
            fi
          done
          rm -f python-tutor-project.zip
          echo "--- AFTER ---"
          ls -la
          chmod +x android/gradlew
          ls -la android/

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
