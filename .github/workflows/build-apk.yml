      - name: Fix and Build
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP" -d .
          PUB=$(find . -type f -name "pubspec.yaml" -not -path "*/.pub-cache/*" | while read f; do d=$(dirname "$f"); [ -d "$d/android" ] && echo "$f"; done | head -n 1)
          if [ -z "$PUB" ]; then PUB=$(find . -type f -name "pubspec.yaml" | head -n 1); fi
          DIR=$(dirname "$PUB")
          cd "$DIR"
          rm -rf android
          flutter create --platforms=android .
          # 1- NDK + Minify
          sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts || true
          if ! grep -q "ndkVersion" android/app/build.gradle.kts; then sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts; fi
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts || true
          # 2- INTERNET PERMISSION - ده اللي بيحل الـ Timeout
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "INTERNET" $MANIFEST; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' $MANIFEST
          fi
          # 3- Uint8List
          if ! grep -q "dart:typed_data" lib/main.dart; then sed -i "1i import 'dart:typed_data';" lib/main.dart; fi
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk
