name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # اسم الزيب اللي هيتبني. لو غيرته في الريبو غيّر الاسم هنا
      ZIP_NAME: python-tutor-project.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      - name: Unpack project
        run: |
          set -e
          ZIP="$ZIP_NAME"
          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" | sort | tail -n 1)
          fi
          echo "Using ZIP: $ZIP"
          rm -rf app_src
          mkdir app_src
          unzip -oq "$ZIP" -d app_src
          PUB=$(find app_src -maxdepth 2 -name pubspec.yaml | head -n 1)
          [ -n "$PUB" ] || { echo "pubspec.yaml not found in zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PUB")" >> $GITHUB_ENV

      - name: Regenerate android and restore project settings
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p /tmp/orig
          cp -r android /tmp/orig/android 2>/dev/null || true

          rm -rf android
          flutter create --platforms=android .

          APP=android/app/build.gradle.kts
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # نفس الـ applicationId القديم (لازم يطابق google-services.json)
          sed -i 's/applicationId = ".*"/applicationId = "com.pylearn.app"/' $APP
          # Firebase محتاج minSdk 23 على الأقل، والمشروع الأصلي كان 24
          sed -i 's/minSdk = .*/minSdk = 24/' $APP
          # البلجنز (firebase, mlkit, ...) محتاجة NDK 27
          sed -i 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' $APP

          # ملف Firebase + بلجن google-services
          cp /tmp/orig/android/app/google-services.json android/app/google-services.json
          sed -i '/id("org.jetbrains.kotlin.android")/a \    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a \    id("com.google.gms.google-services")' $APP

          # صلاحيات الإنترنت والكاميرا
          sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>|' $MANIFEST
          sed -i 's/android:label="[^"]*"/android:label="Python"/' $MANIFEST

          echo "--- check ---"
          grep -n "applicationId\|minSdk\|google-services" $APP android/settings.gradle.kts
          grep -n "uses-permission" $MANIFEST
          ls android/app/google-services.json

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # إصلاح Uint8List في main.dart لو الـ import ناقص
          grep -q "dart:typed_data" lib/main.dart || sed -i "1i import 'dart:typed_data';" lib/main.dart
          grep -n "ndkVersion" android/app/build.gradle.kts
          flutter pub get
          flutter build apk --release --no-shrink --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
