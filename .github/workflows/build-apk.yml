name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      - name: Fix and Build
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            unzip -o "$ZIP" -d .
            rm -f "$ZIP"
          fi

          PUB=$(find . -type f -name "pubspec.yaml" -not -path "*/.pub-cache/*" | while read f; do d=$(dirname "$f"); [ -d "$d/android" ] || [ -d "$d/lib" ] && echo "$f"; done | head -n 1)
          if [ -z "$PUB" ]; then
            PUB=$(find . -type f -name "pubspec.yaml" | head -n 1)
          fi
          
          DIR=$(dirname "$PUB")
          echo "Project DIR: $DIR"
          cd "$DIR"
          pwd
          ls -la
          
          rm -rf android
          flutter create --platforms=android .

          # إصلاح NDK
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts || true
            if ! grep -q "ndkVersion" android/app/build.gradle.kts; then
              sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
            fi
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
            sed -i 's/isShrinkResources = true/isShrinkResources = false/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/ndkVersion .*/ndkVersion "27.0.12077973"/' android/app/build.gradle || true
            if ! grep -q "ndkVersion" android/app/build.gradle; then
              sed -i '/android {/a \    ndkVersion "27.0.12077973"' android/app/build.gradle
            fi
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          fi
          
          if [ -f lib/main.dart ]; then
            if ! grep -q "dart:typed_data" lib/main.dart; then
              sed -i "1i import 'dart:typed_data';" lib/main.dart
            fi
          fi
          
          mkdir -p android/app
          echo "-keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class com.google.android.gms.** { *; }" > android/app/proguard-rules.pro
          
          sed -i 's/flutter_lints: \^5\..*/flutter_lints: ^3.0.0/' pubspec.yaml || true
          
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
