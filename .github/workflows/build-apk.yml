name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
      - name: Fix and Build
        run: |
          find . -name "*.zip" -exec unzip -o {} -d . \; -exec rm -f {} \; || true
          GOOGLE_JSON=$(find . -name "google-services.json" | head -n 1)
          echo "Found json at: $GOOGLE_JSON"
          if [ -n "$GOOGLE_JSON" ]; then
            cp "$GOOGLE_JSON" /tmp/google-services.json
          fi
          PUB=$(find . -type f -name "pubspec.yaml" | head -n 1)
          DIR=$(dirname "$PUB")
          echo "Project dir: $DIR"
          cd "$DIR"
          rm -rf android
          flutter create --platforms=android .
          if [ -f /tmp/google-services.json ]; then
            cp /tmp/google-services.json android/app/google-services.json
            echo "Restored OK"
            ls -lh android/app/google-services.json
          else
            echo "ERROR google-services.json not found"
            exit 1
          fi
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
