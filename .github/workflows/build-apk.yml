name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
      - name: Extract project
        run: |
          # نظف اي نسخ قديمة في الـ root
          rm -rf android ios lib test pubspec.yaml pubspec.lock analysis_options.yaml
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "ZIP=$ZIP"
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d .
          fi
          echo "Finding projects with android folder:"
          find . -type f -name "pubspec.yaml" | while read f; do
            d=$(dirname "$f")
            if [ -d "$d/android" ]; then
              echo "OK -> $f has android"
            else
              echo "NO -> $f missing android"
            fi
          done
      - name: Build APK
        run: |
          # دور على المشروع اللي معاه android
          PUB=$(find . -type f -name "pubspec.yaml" -not -path "*/.pub-cache/*" | while read f; do
            d=$(dirname "$f")
            if [ -d "$d/android" ]; then
              echo "$f"
            fi
          done | head -n 1)
          
          # لو مالقيناش واحد معاه اندرويد، خد اول واحد
          if [ -z "$PUB" ]; then
            PUB=$(find . -type f -name "pubspec.yaml" -not -path "*/.pub-cache/*" | head -n 1)
          fi
          
          echo "Final PUB: $PUB"
          DIR=$(dirname "$PUB")
          echo "DIR: $DIR"
          cd "$DIR"
          ls -la
          ls -la android
          sed -i 's/flutter_lints: \^5\..*/flutter_lints: ^3.0.0/' pubspec.yaml || true
          chmod +x android/gradlew
          flutter clean
          flutter pub get
          flutter build apk --release --verbose
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
