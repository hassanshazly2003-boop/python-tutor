      - name: Fix and Build
        run: |
          # فك أي ZIP موجود مهما كان مكانه
          find . -name "*.zip" -exec unzip -o {} -d . \; -exec rm -f {} \; || true
          
          # دور على ملف Firebase في أي مكان واحفظه
          GOOGLE_JSON=$(find . -name "google-services.json" | head -n 1)
          echo "Found: $GOOGLE_JSON"
          if [ -n "$GOOGLE_JSON" ]; then
            cp "$GOOGLE_JSON" /tmp/google-services.json
          fi

          PUB=$(find . -type f -name "pubspec.yaml" | head -n 1)
          DIR=$(dirname "$PUB")
          cd "$DIR"
          echo "Project DIR: $DIR"

          rm -rf android
          flutter create --platforms=android .

          # رجعه حتى لو مكنش لاقيه قبل كده
          if [ -f /tmp/google-services.json ]; then
            cp /tmp/google-services.json android/app/google-services.json
            echo "✅ Restored google-services.json to android/app/"
          else
            echo "❌ ملف google-services.json مش لاقيه اصلا! لازم ترفعه على GitHub"
            exit 1
          fi

          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk
