name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      - name: Fix project structure
        run: |
          echo "Before fix:"
          ls -la
          if [ -d "python-tutor-project" ]; then
            echo "Found folder, copying contents to root..."
            cp -r python-tutor-project/..
            rm -rf python-tutor-project
          fi
          echo "After fix:"
          ls -la
          chmod +x android/gradlew
          ls -la android/

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
