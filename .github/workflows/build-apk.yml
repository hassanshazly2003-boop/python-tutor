name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      - name: Fix project structure
        run: |
          ls -la
          if [ -f "python-tutor-project.zip" ]; then
            unzip -o python-tutor-project.zip
            rm -f python-tutor-project.zip
          fi
          for d in python-tutor-project python-tutor; do
            if [ -d "$d/android" ]; then
              cp -a $d/..
              rm -rf $d
              break
            fi
          done
          echo "--- AFTER ---"
          ls -la
          ls -la android || echo "NO ANDROID FOLDER"
          chmod +x android/gradlew || true

      - name: Recreate android if missing
        run: |
          if [! -f "android/gradlew" ]; then
            echo "gradlew missing, recreating android folder..."
            flutter create --platforms=android.
          fi
          chmod +x android/gradlew
          ls -la android/

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
