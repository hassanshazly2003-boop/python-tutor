name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: python-tutor-project.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      - name: Unpack project
        run: |
          set -e
          ZIP="$ZIP_NAME"
          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" | sort | tail -n 1)
          fi
          echo "Using ZIP: $ZIP"
          rm -rf app_src
          mkdir app_src
          unzip -oq "$ZIP" -d app_src
          PUB=$(find app_src -maxdepth 3 -name pubspec.yaml | head -n 1)
          [ -n "$PUB" ] || { echo "pubspec.yaml not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PUB")" >> $GITHUB_ENV

      - name: Regenerate android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p /tmp/orig
          cp -r android /tmp/orig/android 2>/dev/null || true
          rm -rf android
          flutter create --platforms=android .
          APP=android/app/build.gradle.kts
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = ".*"/applicationId = "com.pylearn.app"/' $APP
          sed -i 's/minSdk = .*/minSdk = 24/' $APP
          sed -i 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' $APP
          # نوقف الـ shrink صح
          sed -i '/isMinifyEnabled/d' $APP
          sed -i '/isShrinkResources/d' $APP
          sed -i '/signingConfig = signingConfigs.getByName("debug")/a \            isMinifyEnabled = false\n            isShrinkResources = false' $APP
          cp /tmp/orig/android/app/google-services.json android/app/google-services.json
          sed -i '/id("org.jetbrains.kotlin.android")/a \    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a \    id("com.google.gms.google-services")' $APP
          sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>|' $MANIFEST
          sed -i 's/android:label="[^"]*"/android:label="Python"/' $MANIFEST

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          grep -q "dart:typed_data" lib/main.dart || sed -i "1i import 'dart:typed_data';" lib/main.dart
          flutter pub get
          # بناء مقسم عشان الحجم ينزل من 92 لـ 28 ميجا
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*arm64*.apk $GITHUB_WORKSPACE/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          compression-level: 0
