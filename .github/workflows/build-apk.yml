name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Find and extract project zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d app_src
          # انقل محتويات اول فولدر جواه للـ root لو موجود
          if [ -d "app_src" ]; then
            # لو في فولدر واحد بس جواه انقل اللي جواه
            INNER=$(find app_src -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$INNER" ]; then
              cp -r $INNER/* ./ || true
              cp -r $INNER/.* ./ 2>/dev/null || true
            else
              cp -r app_src/* ./ || true
            fi
          fi
          ls -la
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
