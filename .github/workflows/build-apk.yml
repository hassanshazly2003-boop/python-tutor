name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: python-tutor-project.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      - name: Unpack project
        run: |
          set -e
          ZIP="$ZIP_NAME"
          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" | sort | tail -n 1)
          fi
          echo "Using ZIP: $ZIP"
          rm -rf app_src
          mkdir -p app_src
          unzip -oq "$ZIP" -d app_src
          PUB=$(find app_src -maxdepth 3 -name pubspec.yaml | head -n 1)
          echo "PROJECT_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - name: Regenerate Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf android
          flutter create --platforms=android .
          if [ -f "android/app/build.gradle.kts" ]; then
            APP="android/app/build.gradle.kts"
            sed -i 's/applicationId = ".*"/applicationId = "com.pylearn.app"/' "$APP"
            sed -i 's/minSdk = .*/minSdk = 24/' "$APP"
            sed -i 's/ndkVersion = ".*"/ndkVersion = "27.0.12077973"/' "$APP" || echo '    ndkVersion = "27.0.12077973"' >> "$APP"
            sed -i '/isMinifyEnabled/d; /isShrinkResources/d; /minifyEnabled/d; /shrinkResources/d' "$APP" || true
          else
            APP="android/app/build.gradle"
            sed -i 's/applicationId ".*"/applicationId "com.pylearn.app"/' "$APP"
            sed -i 's/minSdkVersion .*/minSdkVersion 24/' "$APP"
            sed -i 's/ndkVersion ".*"/ndkVersion "27.0.12077973"/' "$APP" || echo '    ndkVersion "27.0.12077973"' >> "$APP"
            sed -i '/minifyEnabled/d; /shrinkResources/d' "$APP" || true
          fi

      - name: Fix Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -f pubspec.lock
          cat > pubspec.yaml << 'EOF'
          name: python_app
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            shared_preferences: ^2.2.2
            http: ^1.1.0
            flutter_markdown: ^0.7.7
            google_fonts: ^6.1.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF
          flutter pub get

      - name: Patch main.dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/flutter_markdown_plus/flutter_markdown/g' lib/main.dart || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          ls -lh build/app/outputs/flutter-apk/
          cp $(find build/app/outputs/flutter-apk -name "*arm64*.apk" | head -n 1) $GITHUB_WORKSPACE/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
